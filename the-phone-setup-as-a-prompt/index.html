    ;(async () => {
      const gate = document.getElementById('gate')
      const form = document.getElementById('gate-form')
      const input = document.getElementById('gate-input')
      const errEl = document.getElementById('gate-error')
      const content = document.getElementById('protected-content')
      const cipherEl = document.getElementById('cipher')
      // No cipher payload means the build/encrypt step didn't run — fail closed.
      if (!cipherEl) {
        gate.querySelector('p').textContent = 'This page is not available.'
        form.hidden = true
        return
      }
      const payload = JSON.parse(cipherEl.textContent)
      const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0))

      async function tryUnlock(password) {
        const enc = new TextEncoder()
        const baseKey = await crypto.subtle.importKey(
          'raw',
          enc.encode(password),
          'PBKDF2',
          false,
          ['deriveKey'],
        )
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64(payload.salt), iterations: payload.iter, hash: 'SHA-256' },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt'],
        )
        const plainBuf = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: b64(payload.iv) },
          key,
          b64(payload.ct),
        )
        return new TextDecoder().decode(plainBuf)
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault()
        errEl.hidden = true
        try {
          const html = await tryUnlock(input.value)
          content.innerHTML = html
          content.hidden = false
          gate.hidden = true
          document.title = document.title.replace('Password protected', 'The Phone Setup')
          content.scrollIntoView({ block: 'start' })
        } catch {
          errEl.hidden = false
          input.select()
        }
      })
      input.focus()
    })()
  </script>  </main> <footer class="mt-auto pt-9 md:pt-11 grow-0 flex flex-col gap-6 items-center justify-between max-w-full text-foreground/80"> <div class="flex w-full max-w-md items-center justify-between"> <a href="https://github.com/joshtune" target="_blank" rel="noopener noreferrer" class="social-link"> <span class="sr-only">GitHub</span> <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-7"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" /><path d="M9 18c-4.51 2-5-2-7-2" /></svg> </a>   <a href="https://www.linkedin.com/in/joshtune" target="_blank" rel="noopener noreferrer" class="social-link"> <span class="sr-only">LinkedIn</span> <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-7"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" /><rect width="4" height="12" x="2" y="9" /><circle cx="4" cy="4" r="2" /></svg> </a>   <a href="/rss.xml" class="social-link"> <span class="sr-only">RSS</span> <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-7"><path d="M4 11a9 9 0 0 1 9 9" /><path d="M4 4a16 16 0 0 1 16 16" /><circle cx="5" cy="19" r="1" /></svg> </a> </div> <div class="flex flex-col md:flex-row flex-wrap flex-1 items-center justify-center"> <span class="my-1"> Josh Tune © 2026 </span> <span class="mx-5 hidden md:block"> :: </span> </div> </footer> </div> </body></html>
